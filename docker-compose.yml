version: '3.8'

services:
  doc-ai-env:
    build: 
      context: .
      dockerfile: docker/preprocessing.Dockerfile
    # Đồng bộ code và thư mục data giữa máy Dev 2 và Container
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./run_pipeline.py:/app/run_pipeline.py
    # Giữ container chạy ngầm (để dev 2 có thể chui vào gõ lệnh)
    tty: true