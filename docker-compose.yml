version: '3.8'

services:
  doc-ai-env:
    build: 
      context: .
      dockerfile: docker/preprocessing.Dockerfile
    # Đồng bộ code, data và models giữa máy Dev và Container
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./run_pipeline.py:/app/run_pipeline.py
      - ./models:/app/models  # 🔴 Bổ sung: Nơi chứa tạ (weights) của AI sau khi train
    # Giữ container chạy ngầm
    tty: true